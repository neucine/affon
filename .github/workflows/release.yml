name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Affon
        uses: actions/checkout@v4
        with:
          path: affon-next

      - name: Check out Hao
        uses: actions/checkout@v4
        with:
          repository: neucine/hao
          ref: 50bdf15b1d210af867dff9580408d9e388a495ea
          path: hao

      - name: Check out shared Zig libraries
        uses: actions/checkout@v4
        with:
          repository: neucine/zig-libs
          ref: 240f9b223b35ef8000201f260856e04492766fa0
          path: zig-libs

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify version
        working-directory: affon-next
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          test "v$version" = "$RELEASE_TAG"

      - name: Verify release build
        working-directory: affon-next
        run: |
          zig build test -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe

      - name: Package source release
        working-directory: affon-next
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="affon-next-${RELEASE_TAG#v}.tar.gz"
          mkdir -p package-source verify-source
          git archive --format=tar --prefix="affon-next/" "$GITHUB_SHA" \
            build.zig build.zig.zon README.md src | tar -C verify-source -xf -
          git -C hao archive --format=tar --prefix="hao/" HEAD -- build.zig build.zig.zon include src libs/transpiler | tar -C verify-source -xf -
          git -C zig-libs archive --format=tar --prefix="zig-libs/" HEAD -- build.zig build.zig.zon README.md src .gitignore | tar -C verify-source -xf -
          zig build --build-file verify-source/affon-next/build.zig -Doptimize=ReleaseSafe

          git archive --format=tar --prefix="affon-next/" "$GITHUB_SHA" \
            build.zig build.zig.zon README.md src | tar -C package-source -xf -
          git -C hao archive --format=tar --prefix="hao/" HEAD -- build.zig build.zig.zon include src libs/transpiler | tar -C package-source -xf -
          git -C zig-libs archive --format=tar --prefix="zig-libs/" HEAD -- build.zig build.zig.zon README.md src .gitignore | tar -C package-source -xf -
          tar -C package-source -czf "$archive" affon-next hao zig-libs

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: affon-next/affon-next-*.tar.gz
