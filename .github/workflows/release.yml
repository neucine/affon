name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  R2_BUCKET: affon-downloads
  RUNTIME_PACKAGE_PATH: packages

jobs:
  build:
    name: Build release asset (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: eq12-linux-x64
          - os: darwin-arm64
            runner: macbook-arm64
    runs-on: [self-hosted, "${{ matrix.runner }}"]

    steps:
      - name: Check out Affon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: affon

      - name: Check out Hao
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/hao
          ref: 7c73a564056af4cbb47998278b5253d726e03d9f
          path: hao-legacy

      - name: Check out Compute
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/compute
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN || secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: dc66696c6444d4077bea9e172e1f6e1d990ed223
          path: compute

      - name: Check out shared Zig libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/zig-libs
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN || secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: c5b61fbdd2c7c02d875212e7111a27be3aaf2f17
          path: zig-libs

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16

      - name: Verify version
        working-directory: affon
        env:
          AFFON_RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/release.sh check

      - name: Package and smoke test native release asset
        working-directory: affon
        env:
          AFFON_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./tools/release.sh build
          ./tools/release.sh smoke-local

      - name: Upload native release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affon-release-${{ matrix.os }}
          path: affon/dist/release/*
          if-no-files-found: error

  windows:
    name: Build release asset (windows-x64)
    runs-on: windows-latest

    steps:
      - name: Check out Affon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: affon

      - name: Check out Hao
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/hao
          ref: 7c73a564056af4cbb47998278b5253d726e03d9f
          path: hao-legacy

      - name: Check out Compute
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/compute
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN || secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: dc66696c6444d4077bea9e172e1f6e1d990ed223
          path: compute

      - name: Check out shared Zig libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/zig-libs
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN || secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: c5b61fbdd2c7c02d875212e7111a27be3aaf2f17
          path: zig-libs

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16

      - name: Install Rust Windows LLVM target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-gnullvm

      - name: Install LLVM-MinGW
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          $download = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $download -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          $prefix = (Get-ChildItem $env:RUNNER_TEMP -Directory -Filter "llvm-mingw-*" | Select-Object -First 1).FullName
          "LLVM_MINGW_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "AFFON_WINDOWS_GNU_LIBUNWIND=$prefix\x86_64-w64-mingw32\lib\libunwind.a" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=$prefix\bin\x86_64-w64-mingw32-clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package and smoke test Windows release asset
        working-directory: affon
        shell: bash
        env:
          AFFON_RELEASE_TAG: ${{ github.ref_name }}
          AFFON_RELEASE_PLATFORM: windows-x64
        run: |
          ./tools/release.sh build
          ./tools/release.sh smoke-local
          ./dist/release/affon-${AFFON_RELEASE_TAG}-windows-x64.exe examples/first-program.ts

      - name: Upload Windows release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affon-release-windows-x64
          path: affon/dist/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release and R2 assets
    needs: [build, windows]
    runs-on: [self-hosted, eq12-linux-x64]

    steps:
      - name: Check out Affon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: affon

      - name: Check out Hao
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/hao
          ref: 7c73a564056af4cbb47998278b5253d726e03d9f
          path: hao-legacy

      - name: Check out Compute
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/compute
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN || secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: dc66696c6444d4077bea9e172e1f6e1d990ed223
          path: compute

      - name: Check out shared Zig libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/zig-libs
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN || secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: c5b61fbdd2c7c02d875212e7111a27be3aaf2f17
          path: zig-libs

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Download native release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: affon/dist/release
          merge-multiple: true

      - name: Package source release
        working-directory: affon
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          archive="affon-${RELEASE_TAG#v}.tar.gz"
          mkdir -p dist/source package-source verify-source

          git archive --format=tar --prefix="affon/" "$GITHUB_SHA" \
            build.zig build.zig.zon LICENSE README.md THIRD_PARTY_NOTICES.md install.sh install.ps1 src tools packages/@types/affon | tar -C verify-source -xf -
          git -C ../hao-legacy archive --format=tar --prefix="hao-legacy/" HEAD -- build.zig build.zig.zon include src libs/transpiler | tar -C verify-source -xf -
          git -C ../compute archive --format=tar --prefix="compute/" HEAD -- build.zig build.zig.zon README.md src tools | tar -C verify-source -xf -
          git -C ../zig-libs archive --format=tar --prefix="zig-libs/" HEAD -- build.zig build.zig.zon README.md src .gitignore | tar -C verify-source -xf -
          zig build --build-file verify-source/affon/build.zig -Doptimize=ReleaseSafe

          git archive --format=tar --prefix="affon/" "$GITHUB_SHA" \
            build.zig build.zig.zon LICENSE README.md THIRD_PARTY_NOTICES.md install.sh install.ps1 src tools packages/@types/affon | tar -C package-source -xf -
          git -C ../hao-legacy archive --format=tar --prefix="hao-legacy/" HEAD -- build.zig build.zig.zon include src libs/transpiler | tar -C package-source -xf -
          git -C ../compute archive --format=tar --prefix="compute/" HEAD -- build.zig build.zig.zon README.md src tools | tar -C package-source -xf -
          git -C ../zig-libs archive --format=tar --prefix="zig-libs/" HEAD -- build.zig build.zig.zon README.md src .gitignore | tar -C package-source -xf -
          tar -C package-source -czf "dist/source/$archive" affon hao-legacy compute zig-libs

      - name: Write hosted release metadata
        working-directory: affon
        env:
          AFFON_RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/release.sh metadata

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            affon/dist/release/*
            affon/dist/source/*

      - name: Upload assets to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID secret}"
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN secret}"

          for file in affon/dist/release/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            if [ "$name" = "latest.json" ] || [ "$name" = "$RELEASE_TAG.json" ]; then
              continue
            fi
            npx --yes wrangler r2 object put \
              "$R2_BUCKET/releases/$RELEASE_TAG/$name" \
              --file "$file" \
              --remote
          done

          npx --yes wrangler r2 object put \
            "$R2_BUCKET/releases/latest.json" \
            --file affon/dist/release/latest.json \
            --content-type application/json \
            --remote

          npx --yes wrangler r2 object put \
            "$R2_BUCKET/releases/$RELEASE_TAG.json" \
            --file "affon/dist/release/$RELEASE_TAG.json" \
            --content-type application/json \
            --remote

          npx --yes wrangler r2 object put \
            "$R2_BUCKET/install.sh" \
            --file affon/install.sh \
            --content-type text/x-shellscript \
            --remote

          npx --yes wrangler r2 object put \
            "$R2_BUCKET/install.ps1" \
            --file affon/install.ps1 \
            --content-type text/plain \
            --remote

          npx --yes wrangler r2 object put \
            "$R2_BUCKET/releases/install.sh" \
            --file affon/install.sh \
            --content-type text/x-shellscript \
            --remote

          npx --yes wrangler r2 object put \
            "$R2_BUCKET/releases/install.ps1" \
            --file affon/install.ps1 \
            --content-type text/plain \
            --remote
