name: CI

on:
  push:
  pull_request:

env:
  RUNTIME_PACKAGE_PATH: packages

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Affon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: affon

      - name: Check out Hao
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/hao
          ref: 747c00a26ad48c423956ad332fa2ad3689b31b4b
          path: hao

      - name: Check out Compute
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/compute
          token: ${{ secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: ed3e17b386bc3a35f32f4b51d64f0b5ca238b4e6
          path: compute

      - name: Check out shared Zig libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/zig-libs
          token: ${{ secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: a91b58271be94a4e402a856403fe0fa83add1709
          path: zig-libs

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16

      - name: Run tests
        working-directory: affon
        run: zig build test -Doptimize=ReleaseSafe

      - name: Check model performance gate
        working-directory: affon
        run: python3 -m unittest discover -s test -p 'test_model_performance_gate.py'

      - name: Check workload coverage policy
        working-directory: affon
        run: |
          python3 -m unittest discover -s test -p 'test_coverage_matrix.py'
          python3 -m unittest discover -s test -p 'test_coverage_evidence.py'
          python3 -m unittest discover -s test -p 'test_capability_probes.py'
          python3 -m unittest discover -s test -p 'test_cell_performance_summary.py'
          python3 -m unittest discover -s test -p 'test_performance_report.py'
          python3 -m unittest discover -s test -p 'test_dispatch_boundaries.py'
          python3 -m unittest discover -s test -p 'test_workload_coverage.py'
          python3 tools/coverage-matrix.py --output /tmp/affon-coverage-matrix.json

      - name: Build
        working-directory: affon
        run: zig build -Doptimize=ReleaseSafe

      - name: Type-check public TypeScript contracts
        working-directory: affon
        run: |
          bun x tsc -p src/tsconfig.json --noEmit
          bun x tsc -p test/types/tsconfig.json --noEmit
          bun x tsc -p packages/@affon/models/tsconfig.json --noEmit
          bun x tsc -p packages/@affon/tokenizers/tsconfig.json --noEmit
          bun x tsc -p apps/decoder-lm/tsconfig.json --noEmit

      - name: Run Affon runtime tests
        working-directory: affon
        run: ./tools/test-runtime.sh
