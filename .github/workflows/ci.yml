name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Affon
        uses: actions/checkout@v4
        with:
          path: affon

      - name: Check out Hao
        uses: actions/checkout@v4
        with:
          repository: neucine/hao
          ref: b51da58a1f4e750bcc24ef589fce9a8780e7e210
          path: hao

      - name: Check out shared Zig libraries
        uses: actions/checkout@v4
        with:
          repository: neucine/zig-libs
          ref: 3d04e038b375a4716011166decda25c45289e0f8
          path: zig-libs

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        working-directory: affon
        run: zig build test -Doptimize=ReleaseSafe

      - name: Build
        working-directory: affon
        run: zig build -Doptimize=ReleaseSafe
