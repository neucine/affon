name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Affon
        uses: actions/checkout@v4
        with:
          path: affon

      - name: Check out Hao
        uses: actions/checkout@v4
        with:
          repository: neucine/hao
          ref: b51da58a1f4e750bcc24ef589fce9a8780e7e210
          path: hao

      - name: Check out shared Zig libraries
        uses: actions/checkout@v4
        with:
          repository: neucine/zig-libs
          ref: 3d04e038b375a4716011166decda25c45289e0f8
          path: zig-libs

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Run tests
        working-directory: affon
        run: zig build test -Doptimize=ReleaseSafe

      - name: Build
        working-directory: affon
        run: zig build -Doptimize=ReleaseSafe

      - name: Type-check public TypeScript contracts
        working-directory: affon
        run: |
          bun x tsc -p test/types/tsconfig.json --noEmit
          bun x tsc -p packages/transformers/tsconfig.json --noEmit
          bun x tsc -p packages/lm/tsconfig.json --noEmit
          bun x tsc -p packages/tokenizers/tsconfig.json --noEmit
          bun x tsc -p packages/cnn/tsconfig.json --noEmit
          bun x tsc -p packages/vision/tsconfig.json --noEmit
          bun x tsc -p apps/decoder-lm/tsconfig.json --noEmit

      - name: Run Affon runtime tests
        working-directory: affon
        run: |
          ./zig-out/bin/affon test test/e2e/compute test/e2e/nn test/e2e/dataset test/e2e/checkpoint
          ./zig-out/bin/affon test packages/transformers/test
          ./zig-out/bin/affon test packages/lm/test packages/tokenizers/test apps/decoder-lm/test
