name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check parity policies
        run: |
          for test in test_model_performance_gate test_coverage_evidence test_capability_probes test_cell_performance_summary test_dispatch_boundaries; do
            python3 -m unittest discover -s test/parity -p "${test}.py"
          done
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16
      - name: Type-check public TypeScript contracts
        run: |
          bun x tsc -p src/tsconfig.json --noEmit
          bun x tsc -p test/types/tsconfig.json --noEmit
          bun x tsc -p test/e2e/program/operations/tsconfig.json --noEmit
          bun x tsc -p packages/@affon/models/tsconfig.json --noEmit
          bun x tsc -p packages/@affon/tokenizers/tsconfig.json --noEmit
          bun x tsc -p apps/decoder-lm/tsconfig.json --noEmit

  native-tests:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      RUNTIME_PACKAGE_PATH: packages
    steps:
      - name: Check out Affon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: affon

      - name: Check out Hao
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/hao
          ref: aa59fc076607f98612243e0ecc7f7da019f9dc5d
          path: hao

      - name: Check out Compute
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/compute
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN || secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: c0d89db73c2cdc5e830ed3ff0f507fd26d44a063
          path: compute

      - name: Check out shared Zig libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neucine/zig-libs
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN || secrets.DEPENDENCY_READ_TOKEN }}
          persist-credentials: false
          ref: a91b58271be94a4e402a856403fe0fa83add1709
          path: zig-libs

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16

      - name: Run tests
        working-directory: affon
        run: zig build test -Doptimize=ReleaseSafe

      - name: Build
        working-directory: affon
        run: zig build -Doptimize=ReleaseSafe

      - name: Run Affon runtime tests
        working-directory: affon
        run: ./tools/test-runtime.sh
