name: Set up Zig
description: Install a pinned Zig toolchain from ziglang.org.
inputs:
  version:
    description: Zig version to install.
    required: true
runs:
  using: composite
  steps:
    - name: Install Zig
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) zig_target="x86_64-linux" ;;
          Linux-aarch64) zig_target="aarch64-linux" ;;
          Darwin-x86_64) zig_target="x86_64-macos" ;;
          Darwin-arm64) zig_target="aarch64-macos" ;;
          *)
            echo "unsupported Zig host: $(uname -s)-$(uname -m)" >&2
            exit 1
            ;;
        esac

        install_dir="${RUNNER_TEMP}/zig-${ZIG_VERSION}"
        archive="zig-${zig_target}-${ZIG_VERSION}.tar.xz"
        url="https://ziglang.org/download/${ZIG_VERSION}/${archive}"

        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        curl -fsSL "$url" -o "${install_dir}/${archive}"
        tar -xf "${install_dir}/${archive}" -C "$install_dir" --strip-components=1

        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/zig" version
