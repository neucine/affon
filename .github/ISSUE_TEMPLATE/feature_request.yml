name: Feature request
description: Propose an API, runtime, docs, or tooling improvement.
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or limitation is currently getting in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the API, behavior, docs update, or tooling change you want to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or nearby APIs you already tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Notebook examples, comparable library behavior, or links that clarify the use case.
