name: Bug report
description: Report a runtime, docs, installer, or API problem.
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Affon version
      placeholder: "affon v0.3.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15 arm64, Ubuntu 24.04 x64, ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - runtime
        - compute / tensor
        - nn / optim / metrics
        - dataset / tokenizers
        - checkpoint
        - packages
        - apps
        - module loader
        - docs / examples
        - other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Paste the smallest script, command, or notebook cell that reproduces the problem.
      render: bash
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or stack trace
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, screenshots, comparisons with expected behavior, or likely regressions.
