<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affon Program Inspector</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Affon tooling</p>
      <h1>Program Inspector</h1>
    </div>
    <label class="import-button">
      Open inspection JSON
      <input id="file" type="file" accept="application/json,.json">
    </label>
  </header>
  <main>
    <section class="overview" aria-label="Inspection overview">
      <div>
        <h2 id="program-name">Arithmetic example</h2>
        <p id="program-kind">authored · serialized ProgramInspection</p>
      </div>
      <div id="summary" class="summary"></div>
      <div class="controls">
        <label>Search <input id="search" type="search" placeholder="name, op, dtype, shape, path…"></label>
        <label>Role <select id="role"><option value="">All roles</option></select></label>
      </div>
    </section>
    <section class="workspace">
      <article class="panel structure-panel">
        <div class="panel-heading"><h2>Structure</h2><span>composition paths</span></div>
        <div id="structure" class="tree"></div>
      </article>
      <article class="panel graph-panel">
        <div class="panel-heading"><h2>Graph</h2><span>operand → consumer</span></div>
        <div id="graph" class="graph-scroll"><svg aria-label="Program dependency graph"></svg></div>
      </article>
      <article class="panel details-panel">
        <div class="panel-heading"><h2>Details</h2><span id="selection-kind">scope</span></div>
        <div id="details" class="details"></div>
      </article>
    </section>
  </main>
  <div id="drop-zone" hidden>Drop inspection JSON to open</div>
  <script type="module" src="./app.js"></script>
</body>
</html>
