steps:
  - label: ":mag: Fast Affon checks"
    key: fast
    if: 'build.tag == null && build.branch !~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    command: tools/buildkite/release-build.sh fast
    agents:
      queue: macos-local
    secrets:
      - PRIVATE_REPO_READ_TOKEN

  - label: ":bookmark: Detect merged release"
    key: detect-merged-release
    if: 'build.tag == null && build.branch == "main"'
    command: python3 tools/buildkite/ci.py detect
    agents:
      queue: macos-local

  - label: ":bookmark: Check candidate version"
    key: candidate-version
    if: 'build.tag == null && build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    command: python3 tools/buildkite/ci.py candidate
    agents:
      queue: macos-local

  - wait: ~

  - label: ":lock: Scan merged commit"
    key: secret-scan
    if: 'build.tag == null && build.branch == "main"'
    command: PATH="/usr/local/go/bin:/opt/homebrew/bin:$PATH" go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --source . --log-opts="--first-parent -1" --no-banner --redact
    agents:
      queue: macos-local

  - label: ":mag: Check pinned release dependencies"
    key: candidate-dependency-pins
    if: 'build.tag == null && build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    command: bash tools/buildkite/release-deps.sh --check-pins
    agents:
      queue: macos-local
    secrets:
      - PRIVATE_REPO_READ_TOKEN

  - wait: ~

  - label: ":mac: Verify macOS candidate"
    key: candidate-macos
    if: 'build.tag == null && build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    command: tools/buildkite/release-build.sh darwin-arm64
    agents:
      queue: macos-local
    secrets:
      - PRIVATE_REPO_READ_TOKEN

  - label: ":linux: Verify Linux candidate"
    key: candidate-linux
    if: 'build.tag == null && build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    command: tools/buildkite/release-build.sh linux-x64
    agents:
      queue: linux-local-gpu
    secrets:
      - PRIVATE_REPO_READ_TOKEN

  - label: ":windows: Verify Windows candidate"
    key: candidate-windows
    if: 'build.tag == null && build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    command: bash tools/buildkite/release-build.sh windows-x64
    agents:
      queue: windows-local
    secrets:
      - PRIVATE_REPO_READ_TOKEN

  - wait: ~

  - label: ":package: Check candidate archives"
    key: candidate-collect
    if: 'build.tag == null && build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    command: python3 tools/buildkite/ci.py collect candidate
    agents:
      queue: macos-local
